<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FZ // Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: #05070a;
    color: #e6f1ff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* grade sutil de fundo */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 255, 200, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 200, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  .card {
    text-align: center;
    width: min(92vw, 680px);
    max-height: 94vh;
    overflow-y: auto;
    padding: clamp(2rem, 8vw, 4rem) clamp(1.25rem, 6vw, 5rem);
    border: 1px solid rgba(0, 255, 200, 0.15);
    border-radius: 4px;
    background: rgba(10, 15, 20, 0.6);
    backdrop-filter: blur(6px);
    position: relative;
    animation: fadeIn 1.2s ease both;
  }

  /* cantos decorativos */
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: #00ffc8;
    border-style: solid;
  }
  .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .label {
    font-size: clamp(0.6rem, 2.4vw, 0.75rem);
    letter-spacing: clamp(0.2em, 1.5vw, 0.5em);
    text-transform: uppercase;
    color: rgba(0, 255, 200, 0.6);
    margin-bottom: clamp(1.25rem, 5vw, 2rem);
    white-space: nowrap;
  }

  .dias {
    font-size: clamp(6rem, 20vw, 12rem);
    font-weight: 200;
    line-height: 1;
    color: #00ffc8;
    text-shadow:
      0 0 10px rgba(0, 255, 200, 0.6),
      0 0 40px rgba(0, 255, 200, 0.3),
      0 0 80px rgba(0, 255, 200, 0.15);
    animation: pulse 3s ease-in-out infinite;
  }

  .texto {
    margin-top: clamp(1.25rem, 5vw, 2rem);
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(230, 241, 255, 0.85);
  }

  .texto strong {
    color: #00ffc8;
    font-weight: 500;
  }

  /* ---- registro dos últimos surtos ---- */
  .surtos {
    margin-top: clamp(1.5rem, 6vw, 2.5rem);
    text-align: left;
    border-top: 1px solid rgba(0, 255, 200, 0.12);
    padding-top: clamp(1rem, 4vw, 1.5rem);
  }

  .surtos-header {
    font-size: clamp(0.55rem, 2vw, 0.65rem);
    letter-spacing: clamp(0.15em, 1vw, 0.35em);
    text-transform: uppercase;
    color: rgba(255, 80, 120, 0.7);
    margin-bottom: 0.9rem;
  }

  .surtos ol {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .surtos li {
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
    font-size: clamp(0.8rem, 2.6vw, 0.95rem);
    font-weight: 300;
    padding: 0.55rem 0.8rem;
    border-left: 2px solid rgba(255, 80, 120, 0.5);
    background: rgba(255, 80, 120, 0.05);
    border-radius: 0 3px 3px 0;
  }

  .surtos .data {
    font-size: clamp(0.6rem, 2vw, 0.7rem);
    letter-spacing: 0.1em;
    color: rgba(0, 255, 200, 0.6);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .surtos .quem { color: #ff9ab5; font-weight: 500; }
  .surtos .motivo { color: rgba(230, 241, 255, 0.75); }

  .statusline {
    margin-top: clamp(1.5rem, 6vw, 2.5rem);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(230, 241, 255, 0.35);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ffc8;
    box-shadow: 0 0 8px #00ffc8;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 10px rgba(0,255,200,0.6), 0 0 40px rgba(0,255,200,0.3), 0 0 80px rgba(0,255,200,0.15); }
    50%      { text-shadow: 0 0 16px rgba(0,255,200,0.9), 0 0 60px rgba(0,255,200,0.5), 0 0 110px rgba(0,255,200,0.25); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .toast {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: max-content;
    max-width: min(70vw, 320px);
    padding: clamp(0.7rem, 2.5vw, 1rem) clamp(0.9rem, 3vw, 1.4rem);
    border: 1px solid rgba(255, 80, 120, 0.4);
    border-left: 3px solid #ff5078;
    border-radius: 4px;
    background: rgba(20, 8, 12, 0.85);
    backdrop-filter: blur(6px);
    box-shadow: 0 0 24px rgba(255, 80, 120, 0.15);
    font-size: clamp(0.75rem, 2.5vw, 0.9rem);
    letter-spacing: 0.06em;
    animation: fadeIn 1s ease both, wander 120s ease-in-out infinite;
    z-index: 10;
  }

  .toast .tag {
    font-size: clamp(0.5rem, 1.8vw, 0.6rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #ff5078;
    white-space: nowrap;
  }

  .toast p { color: rgba(255, 230, 236, 0.95); }

  /* deriva lenta: x fica entre 3vw e 28vw (folga p/ a largura máx. de 70vw) */
  @keyframes wander {
    0%   { transform: translate(3vw,  4vh); }
    12%  { transform: translate(24vw, 12vh); }
    25%  { transform: translate(10vw, 34vh); }
    38%  { transform: translate(28vw, 55vh); }
    50%  { transform: translate(6vw,  78vh); }
    62%  { transform: translate(22vw, 62vh); }
    75%  { transform: translate(28vw, 30vh); }
    88%  { transform: translate(12vw, 14vh); }
    100% { transform: translate(3vw,  4vh); }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="label">Time FZ // Monitor de Sanidade</div>
    <div class="dias" id="dias">–</div>
    <p class="texto" id="texto">Estamos a <strong>… dias</strong> sem ninguém surtar no time FZ</p>

    <section class="surtos">
      <div class="surtos-header">Registro // Últimos 5 surtados</div>
      <ol id="lista-surtos"></ol>
    </section>

    <div class="statusline"><span class="dot"></span> Sistema estável</div>
  </main>

  <div class="toast" role="alert">
    <span class="tag">⚠ Diagnóstico</span>
    <p>sim, é culpa do Careca</p>
  </div>

  <script>
    // =====================================================================
    // REGISTRO DE SURTOS — edite SOMENTE este array.
    //
    // Para registrar um novo surto, adicione uma linha NO FINAL da lista,
    // no formato:
    //   { data: 'AAAA-MM-DD', quem: 'Nome', motivo: 'o que aconteceu' },
    //
    // Não precisa apagar os antigos: a tela exibe automaticamente só os
    // 5 mais recentes (do mais novo pro mais velho), e o contador de dias
    // no topo é recalculado sozinho a partir da data do último surto.
    // =====================================================================
    const SURTOS = [
      { data: '2026-07-22', quem: 'Chico', motivo: 'perdeu de 10 à 0 pra smoke' },
    ];
    // =====================================================================

    // 'AAAA-MM-DD' → Date à meia-noite local (evita o deslocamento de fuso
    // que new Date('AAAA-MM-DD') causa por interpretar como UTC)
    function parseData(iso) {
      const [a, m, d] = iso.split('-').map(Number);
      return new Date(a, m - 1, d);
    }

    function formatData(iso) {
      const d = parseData(iso);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    const ultimos5 = SURTOS
      .slice()
      .sort((a, b) => parseData(a.data) - parseData(b.data))
      .slice(-5)
      .reverse();

    document.getElementById('lista-surtos').innerHTML = ultimos5.map(s => `
      <li>
        <span class="data">${formatData(s.data)}</span>
        <span><span class="quem">${s.quem}</span> — <span class="motivo">${s.motivo}</span></span>
      </li>
    `).join('');

    // contador: dias corridos desde o surto mais recente
    const maisRecente = ultimos5[0];
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    const dias = Math.max(0, Math.round((hoje - parseData(maisRecente.data)) / 86400000));
    const plural = dias === 1 ? 'dia' : 'dias';

    document.getElementById('dias').textContent = dias;
    document.getElementById('texto').innerHTML =
      `Estamos a <strong>${dias} ${plural}</strong> sem ninguém surtar no time FZ`;
  </script>
</body>
</html>
